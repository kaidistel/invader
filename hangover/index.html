<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Hangover — 80m Freefall Simulator</title>
<style>
:root{--panel:rgba(8,13,21,.93);--line:#2b3950;--text:#eef5ff;--muted:#91a1b7;--yellow:#ffd31a;--red:#ff5463;--green:#63e6a2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:20;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));height:54px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 14px;backdrop-filter:blur(12px);box-shadow:0 12px 30px #0007}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.03em}.state{border:1px solid #42536f;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.panel{position:fixed;z-index:15;top:78px;width:270px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 14px 36px #0008}.left{left:12px}.right{right:12px}.section{margin-bottom:13px}.section:last-child{margin-bottom:0}.section h3{margin:0 0 8px;color:#9fb0c8;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{border:1px solid #213046;background:#0b121d;border-radius:10px;padding:9px}.metric span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.metric b{display:block;font-size:16px;margin-top:2px}.row{display:flex;justify-content:space-between;gap:8px;color:#afbdd0;font-size:12px;margin:6px 0}.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2d3948}.lamp.on{background:var(--green);box-shadow:0 0 9px #63e6a277}.lamp.warn{background:var(--yellow)}button,select,input{font:inherit}button{border:1px solid #34445e;background:#111a28;color:#eef5ff;border-radius:10px;padding:10px;font-weight:800;min-height:42px;cursor:pointer;touch-action:manipulation}button.primary{background:#e5b900;color:#111;border-color:#ffe35c}button.danger{background:#42151b;border-color:#7d2832;color:#ffc0c5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}select{width:100%;min-height:42px;background:#0b1420;color:#eef5ff;border:1px solid #34445e;border-radius:9px;padding:8px}input[type=range]{width:100%}.bottom{position:fixed;z-index:18;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(12px)}.bottom button{white-space:nowrap;min-height:38px;padding:8px 10px;font-size:11px}.mobileDock{display:none}.loading{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:#05070b;color:white;font-weight:800;letter-spacing:.06em;text-align:center;padding:24px}.loading.hide{display:none}.error{color:#ff9da5;font-size:12px;max-width:85vw;line-height:1.5}
@media(max-width:700px){.top{left:8px;right:8px;height:48px;padding:0 10px}.brand{font-size:11px}.brand small{display:none}.state{font-size:9px;padding:6px 8px}.panel{left:8px;right:8px;top:auto;bottom:68px;width:auto;max-height:60vh;overflow:auto;transform:translateY(calc(100% + 100px));transition:.2s}.panel.open{transform:translateY(0)}.bottom{left:8px;right:8px;transform:none;overflow-x:auto}.bottom button{font-size:10px}.mobileDock{display:flex;position:fixed;z-index:22;right:10px;top:64px;gap:6px}.mobileDock button{min-height:36px;padding:7px 9px;font-size:10px;background:var(--panel)}.metric b{font-size:14px}}
</style>
</head>
<body>
<div id="loading" class="loading">SIMULATOR WIRD GELADEN …</div><div id="view"></div>
<div class="top"><div class="brand">HANGOVER // THE TOWER<small>Funtime 80 m · Web3D Operator Simulator</small></div><div id="state" class="state">LOADING</div></div>
<div class="mobileDock"><button id="showData">DATEN</button><button id="showControl">STEUERUNG</button></div>
<div id="dataPanel" class="panel left"><div class="section"><h3>Live telemetry</h3><div class="grid"><div class="metric"><span>Höhe</span><b id="height">3.2 m</b></div><div class="metric"><span>Speed</span><b id="speed">0.0 m/s</b></div><div class="metric"><span>G-Force</span><b id="gforce">1.00 g</b></div><div class="metric"><span>Rotation</span><b id="rpm">0.0 rpm</b></div></div></div><div class="section"><h3>Systems</h3><div class="row"><span><i class="lamp on"></i> PLC</span><b>READY</b></div><div class="row"><span><i id="restLamp" class="lamp"></i> Bügelkreis</span><b id="restTxt">OPEN</b></div><div class="row"><span><i id="brakeLamp" class="lamp on"></i> Magnetbremse</span><b id="brakeTxt">READY</b></div></div><div class="section"><h3>Kamera</h3><select id="cameraSel"><option value="orbit">Freie Kamera</option><option value="ground">Bodenansicht</option><option value="onride">Onride</option><option value="tower">Turmkamera</option></select></div></div>
<div id="controlPanel" class="panel right"><div class="section"><h3>Operator panel</h3><div class="controls"><button id="lock">Bügel schließen</button><button id="unlock">Bügel öffnen</button><button id="cycle" class="primary full">Automatikzyklus starten</button><button id="lift">Lift manuell</button><button id="drop">Drop freigeben</button><button id="return">Return</button><button id="rotate">Rotation</button><button id="estop" class="danger full">NOT-AUS</button></div></div><div class="section"><h3>Parameter</h3><div class="row"><span>Top Hold</span><b id="holdVal">2.5 s</b></div><input id="hold" type="range" min="0.5" max="8" step="0.5" value="2.5"><div class="row"><span>Lift Speed</span><b id="liftVal">1.9 m/s</b></div><input id="liftSpeed" type="range" min="0.7" max="3.2" step="0.1" value="1.9"><div class="row"><span>Rotation</span><b id="rotVal">1.2 rpm</b></div><input id="rotSpeed" type="range" min="0" max="2.5" step="0.1" value="1.2"></div></div>
<div class="bottom"><button data-cam="orbit">ORBIT</button><button data-cam="ground">GROUND</button><button data-cam="onride">ONRIDE</button><button data-cam="tower">TOWER</button><button id="resetView">RESET</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(function(){
const loading=document.getElementById('loading');
window.addEventListener('error',function(e){if(!loading.classList.contains('hide'))loading.innerHTML='<div class="error">Simulator konnte nicht gestartet werden.<br><br>'+String(e.message||'Unbekannter Fehler')+'</div>'});
try{
if(!window.THREE)throw new Error('Three.js konnte nicht geladen werden.');
const THREE=window.THREE,$=id=>document.getElementById(id),mobile=matchMedia('(max-width:700px)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86b8e6);scene.fog=new THREE.Fog(0x9fc8ea,95,180);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,400);
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.25:2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;$('view').appendChild(renderer.domElement);
let orbitTheta=.68,orbitPhi=1.15,orbitRadius=72,targetY=30,drag=false,lastX=0,lastY=0,pinchDist=0;
function applyOrbit(){const sp=Math.sin(orbitPhi);camera.position.set(Math.sin(orbitTheta)*sp*orbitRadius,targetY+Math.cos(orbitPhi)*orbitRadius,Math.cos(orbitTheta)*sp*orbitRadius);camera.lookAt(0,targetY,0)}applyOrbit();
const cvs=renderer.domElement;cvs.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId)});cvs.addEventListener('pointermove',e=>{if(!drag||cam!=='orbit')return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;orbitTheta-=dx*.006;orbitPhi=Math.max(.18,Math.min(1.48,orbitPhi+dy*.006));applyOrbit()});cvs.addEventListener('pointerup',()=>drag=false);cvs.addEventListener('pointercancel',()=>drag=false);cvs.addEventListener('wheel',e=>{if(cam!=='orbit')return;e.preventDefault();orbitRadius=Math.max(8,Math.min(150,orbitRadius+e.deltaY*.05));applyOrbit()},{passive:false});cvs.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});cvs.addEventListener('touchmove',e=>{if(cam!=='orbit'||e.touches.length!==2)return;const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchDist){orbitRadius=Math.max(8,Math.min(150,orbitRadius-(d-pinchDist)*.08));applyOrbit()}pinchDist=d},{passive:true});
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x435334,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(30,90,35);scene.add(sun);
const M={steel:new THREE.MeshStandardMaterial({color:0xd7dadd,metalness:.8,roughness:.4}),white:new THREE.MeshStandardMaterial({color:0xf3f3ef,metalness:.55,roughness:.42}),yellow:new THREE.MeshStandardMaterial({color:0xf5c400,metalness:.4,roughness:.4}),red:new THREE.MeshStandardMaterial({color:0x8b2028,metalness:.3,roughness:.5}),dark:new THREE.MeshStandardMaterial({color:0x15191f,metalness:.5,roughness:.4}),purple:new THREE.MeshStandardMaterial({color:0x6d2d73,metalness:.25,roughness:.5}),led:new THREE.MeshStandardMaterial({color:0xf1c95b,emissive:0xffc928,emissiveIntensity:.8})};
function box(w,h,d,m,x=0,y=0,z=0,p=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}function cyl(r,h,m,x=0,y=0,z=0,p=scene,s=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m);o.position.set(x,y,z);p.add(o);return o}function beam(a,b,r=.05,m=M.steel,p=scene){const v=new THREE.Vector3().subVectors(b,a),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),6),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());p.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x78935a,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);box(21,.5,18,M.steel,0,.25,0);box(19,5,.5,M.purple,0,3,-7.2);
const tower=new THREE.Group();scene.add(tower);const H=80,h=1.2,c=[[-h,-h],[h,-h],[h,h],[-h,h]];for(const [x,z] of c)box(.18,H,.18,M.white,x,H/2+.8,z,tower);for(let yy=.8;yy<=80;yy+=4){for(let i=0;i<4;i++){const [x1,z1]=c[i],[x2,z2]=c[(i+1)%4];beam(new THREE.Vector3(x1,yy,z1),new THREE.Vector3(x2,yy,z2),.04,M.steel,tower);if(yy<77)beam(new THREE.Vector3(x1,yy,z1),new THREE.Vector3(x2,yy+4,z2),.033,M.steel,tower)}}box(.18,70,.22,M.yellow,-1.5,36,0,tower);box(.18,70,.22,M.yellow,1.5,36,0,tower);for(let yy=4;yy<21;yy+=1.15){box(.14,.72,.5,M.dark,-1.5,yy,0,tower);box(.14,.72,.5,M.dark,1.5,yy,0,tower)}cyl(1.8,.2,M.red,0,81.3,0,tower,24);
const carriage=new THREE.Group(),rotator=new THREE.Group();scene.add(carriage);carriage.add(rotator);cyl(2,.42,M.yellow,0,0,0,rotator,24);cyl(1.45,.7,M.yellow,0,.35,0,rotator,16);for(let i=0;i<8;i++){const ang=i*Math.PI/4;beam(new THREE.Vector3(Math.cos(ang)*1.45,.4,Math.sin(ang)*1.45),new THREE.Vector3(Math.cos(ang)*1.9,2.6,Math.sin(ang)*1.9),.075,M.yellow,rotator)}cyl(1.85,.18,M.yellow,0,2.6,0,rotator,16);for(let i=0;i<24;i++){const ang=i*Math.PI*2/24,g=new THREE.Group();g.position.set(Math.cos(ang)*3.5,0,Math.sin(ang)*3.5);g.rotation.y=-ang+Math.PI/2;rotator.add(g);box(.62,.22,.72,M.red,0,-.1,0,g);box(.62,1.02,.18,M.red,0,.47,-.28,g);beam(new THREE.Vector3(-.28,.92,-.1),new THREE.Vector3(-.3,.1,.2),.042,M.yellow,g);beam(new THREE.Vector3(.28,.92,-.1),new THREE.Vector3(.3,.1,.2),.042,M.yellow,g);beam(new THREE.Vector3(-.28,.92,-.1),new THREE.Vector3(.28,.92,-.1),.042,M.yellow,g)}const halo=new THREE.Mesh(new THREE.RingGeometry(2.2,4.55,mobile?32:64),M.led);halo.rotation.x=-Math.PI/2;halo.position.y=2.25;rotator.add(halo);box(2.9,1.25,2.9,M.red,0,1.2,0,rotator);box(2.45,1.02,2.45,M.yellow,0,1.25,0,rotator);
let state='LOADING',locked=false,auto=false,rotation=true,estop=false,y=3.25,v=0,a=0,holdTimer=0,cam='orbit';const loadY=3.25,topY=73.5,brakeY=20;carriage.position.y=y;
function setState(s){state=s;$('state').textContent=s}function lock(){locked=true;$('restLamp').className='lamp on';$('restTxt').textContent='LOCKED';setState('LOCKED')}function unlock(){if(Math.abs(y-loadY)<.2){locked=false;$('restLamp').className='lamp';$('restTxt').textContent='OPEN';setState('LOADING')}}function release(){if(estop||!locked||y<25)return;v=0;setState('FREEFALL')}function cycle(){if(estop)return;lock();auto=true;setTimeout(()=>{if(auto&&!estop)setState('LIFTING')},300)}
$('lock').onclick=lock;$('unlock').onclick=unlock;$('cycle').onclick=cycle;$('lift').onclick=()=>{if(!estop){lock();auto=false;setState('LIFTING')}};$('drop').onclick=release;$('return').onclick=()=>{if(!estop){auto=false;setState('RETURN')}};$('rotate').onclick=()=>rotation=!rotation;$('estop').onclick=()=>{estop=true;auto=false;v=0;setState('E-STOP')};$('resetView').onclick=()=>{orbitTheta=.68;orbitPhi=1.15;orbitRadius=72;targetY=30;cam='orbit';$('cameraSel').value='orbit';applyOrbit()};function setCam(x){cam=x;$('cameraSel').value=x;if(x==='orbit')applyOrbit()}$('cameraSel').onchange=e=>setCam(e.target.value);document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setCam(b.dataset.cam));['hold','liftSpeed','rotSpeed'].forEach(id=>$(id).oninput=()=>{$('holdVal').textContent=(+$('hold').value).toFixed(1)+' s';$('liftVal').textContent=(+$('liftSpeed').value).toFixed(1)+' m/s';$('rotVal').textContent=(+$('rotSpeed').value).toFixed(1)+' rpm'});$('showData').onclick=()=>{$('dataPanel').classList.toggle('open');$('controlPanel').classList.remove('open')};$('showControl').onclick=()=>{$('controlPanel').classList.toggle('open');$('dataPanel').classList.remove('open')};
const clock=new THREE.Clock();function update(dt){dt=Math.min(dt,.033);if(!estop){if(state==='LIFTING'){a=0;v=+$('liftSpeed').value;y+=v*dt;if(y>=topY){y=topY;v=0;holdTimer=0;setState('TOP HOLD')}}else if(state==='TOP HOLD'){a=0;v=0;holdTimer+=dt;if(auto&&holdTimer>=+$('hold').value)release()}else if(state==='FREEFALL'){a=-9.81;v+=a*dt;y+=v*dt;if(y<=brakeY){y=brakeY;setState('MAGNETIC BRAKE')}}else if(state==='MAGNETIC BRAKE'){a=20+Math.min(24,Math.abs(v));v+=a*dt;if(v>-.8)v=-.8;y+=v*dt;if(y<=loadY+1.4)setState('RETURN')}else if(state==='RETURN'){a=0;v=-.65;y+=v*dt;if(y<=loadY){y=loadY;v=0;setState('LOCKED');if(auto){auto=false;setTimeout(unlock,700)}}else{a=0;v=0}}y=Math.max(loadY,Math.min(topY,y));carriage.position.y=y;if(rotation)rotator.rotation.y+=(+$('rotSpeed').value)*Math.PI*2/60*dt;$('height').textContent=y.toFixed(1)+' m';$('speed').textContent=Math.abs(v).toFixed(1)+' m/s';$('gforce').textContent=Math.max(0,1+a/9.81).toFixed(2)+' g';$('rpm').textContent=(rotation?+$('rotSpeed').value:0).toFixed(1)+' rpm';$('brakeLamp').className='lamp '+(state==='MAGNETIC BRAKE'?'warn':'on');$('brakeTxt').textContent=state==='MAGNETIC BRAKE'?'ACTIVE':'READY';if(cam==='ground'){camera.position.lerp(new THREE.Vector3(12,3.7,23),.08);camera.lookAt(0,42,0)}else if(cam==='tower'){camera.position.lerp(new THREE.Vector3(5.5,77,7),.08);camera.lookAt(0,y,0)}else if(cam==='onride'){const ang=6*Math.PI*2/24+rotator.rotation.y,pos=new THREE.Vector3(Math.cos(ang)*3.55,y+.55,Math.sin(ang)*3.55);camera.position.lerp(pos,.3);camera.lookAt(Math.cos(ang)*20,y+.3,Math.sin(ang)*20)}}function animate(){requestAnimationFrame(animate);update(clock.getDelta());renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(cam==='orbit')applyOrbit()});setState('LOADING');loading.classList.add('hide');
}catch(e){console.error(e);loading.innerHTML='<div class="error">Simulator konnte nicht gestartet werden.<br><br>'+String(e.message||e)+'</div>'}
})();
</script>
</body></html>
