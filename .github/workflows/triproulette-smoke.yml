name: TripRoulette smoke test
on:
  push:
    branches: [main]
    paths:
      - 'triproulette/**'
      - '.github/workflows/triproulette-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check triproulette/live.js
          node --check triproulette/quality.js
          node --check triproulette/themes.js
          node --check triproulette/smart.js
          node --check triproulette/speed.js
          node --check triproulette/world-data.js
          node --check triproulette/world.js
          node triproulette/test-world.cjs
          node triproulette/test-speed.cjs
          node triproulette/test-groups.cjs
          node triproulette/test-route-cache.cjs
          node triproulette/test-smart.cjs
          node triproulette/test-themes.cjs
          node triproulette/test-quality.cjs
          node --check triproulette/server.mjs
      - name: Check local HTTP server
        run: |
          node triproulette/server.mjs &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:8765/ | grep -q 'WORLD COMPANION'
          curl --fail -s http://127.0.0.1:8765/live.js -o /tmp/live.js
          node --check /tmp/live.js
      - name: Mobile browser interaction test
        run: |
          npm install --prefix /tmp/naehen-browser --no-audit --no-fund playwright-core@1.51.1
          node triproulette/server.mjs &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:8765/ -o /dev/null
          PLAYWRIGHT_CORE=/tmp/naehen-browser/node_modules/playwright-core CHROME_PATH=$(command -v google-chrome || command -v chromium) node triproulette/test-browser.cjs
      - name: End-to-end hosted package search
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          endpoint='https://triproulette-two.vercel.app/api/mcp'
          headers={'Content-Type':'application/json','Accept':'application/json','Origin':'https://kaidistel.github.io'}
          def rpc(method,params,idx=None):
              payload={'jsonrpc':'2.0','method':method,'params':params}
              if idx is not None: payload['id']=idx
              req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      session=resp.headers.get('Mcp-Session-Id')
                      if session: headers['Mcp-Session-Id']=session
                      assert resp.headers.get('Access-Control-Allow-Origin')=='https://kaidistel.github.io','CORS failure'
                      raw=resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,e.read().decode()[:500]); raise
          init=rpc('initialize',{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'TripRoulette-smoke','version':'0.6'}},1)
          assert init.get('result',{}).get('protocolVersion'),init
          headers['MCP-Protocol-Version']=init['result']['protocolVersion']
          rpc('notifications/initialized',{})
          tools=rpc('tools/list',{},2)
          tool=next(t for t in tools['result']['tools'] if t['name']=='search_flight_and_hotel_package')
          print('Tool schema:',json.dumps(tool['inputSchema']))
          props=tool['inputSchema']['properties']
          args={'origin':'DUS','destination':'MLA','date_from':'2026-12-11','date_to':'2026-12-15','adults':1 if props['adults'].get('type') in ['integer','number'] else '1','ch_ages':'','lang':'de','sort':'price','max_results':3,'accommodation_type':'1,2,3,5,6,7,8,9,12,13,14'}
          response=rpc('tools/call',{'name':tool['name'],'arguments':{k:v for k,v in args.items() if k in props}},3)
          assert 'result' in response and not response['result'].get('isError'),str(response)[:800]
          result=response['result'].get('structuredContent') or json.loads(response['result']['content'][0]['text'])
          assert result['success'] and len(result['products_summary'])>0,result
          print('Package results:',json.dumps(result['products_summary'],ensure_ascii=False)[:5000])
          roomtool=next(t for t in tools['result']['tools'] if t['name']=='select_hotel_options')
          def typed(t,k,v):
              return str(v) if t['inputSchema']['properties'][k].get('type')=='string' else v
          first=result['products_summary'][0]
          roomargs={k:typed(roomtool,k,v) for k,v in {'search_id':result['search_id'],'hotel_internal_id':first['internal_id_hotel'],'date_from':'2026-12-11','date_to':'2026-12-15'}.items()}
          room=rpc('tools/call',{'name':roomtool['name'],'arguments':roomargs},4)
          assert 'result' in room and not room['result'].get('isError'),str(room)[:1000]
          roomdata=room['result'].get('structuredContent') or json.loads(room['result']['content'][0]['text'])
          print('Room schema:',json.dumps(roomtool['inputSchema']))
          print('Room response:',json.dumps(roomdata,ensure_ascii=False)[:16000])
          PY
