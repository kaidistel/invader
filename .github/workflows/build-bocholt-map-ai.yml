name: Build Bocholt map AI

on:
  push:
    paths:
      - ".github/workflows/build-bocholt-map-ai.yml"

permissions:
  contents: write

jobs:
  upscale-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare source
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("naehen/assets/bocholt-kirmes-2026-plan.webp").convert("RGB")
          # The supplied screenshot was about 526 px. Returning to that fixed
          # source scale prevents recursively enlarging an earlier interpolation.
          src = src.resize((526, 526), Image.Resampling.LANCZOS)
          src.save("/tmp/bocholt-plan-source.png", "PNG", optimize=True)
          print("source", src.size)
          PY

      - name: Install Real-ESRGAN
        run: |
          set -euxo pipefail
          python -m pip install --quiet             torch==2.1.2 torchvision==0.16.2             --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          python -m pip install --quiet basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          python -m pip install --quiet -r /tmp/Real-ESRGAN/requirements.txt
          cd /tmp/Real-ESRGAN
          python setup.py develop >/dev/null
          mkdir -p weights
          curl --fail --location --retry 4             "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth"             -o weights/RealESRGAN_x4plus.pth

      - name: Super resolve map to 2K
        run: |
          set -euxo pipefail
          mkdir -p /tmp/bocholt-sr
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py             -n RealESRGAN_x4plus             -i /tmp/bocholt-plan-source.png             -o /tmp/bocholt-sr             --outscale 4             --tile 192             --suffix sr             --ext png
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          candidates = list(Path("/tmp/bocholt-sr").glob("*_sr.png"))
          if not candidates:
              raise SystemExit("No Real-ESRGAN output")
          img = Image.open(candidates[0]).convert("RGB")
          # 526 × 4 = 2104. Keep the neural output essentially native.
          if img.size != (2104, 2104):
              img = img.resize((2104, 2104), Image.Resampling.LANCZOS)
          img = img.filter(ImageFilter.UnsharpMask(radius=.35, percent=105, threshold=2))
          out = Path("naehen/assets/bocholt-kirmes-2026-plan.webp")
          img.save(out, "WEBP", quality=98, method=6)
          print("FINAL", img.size, out.stat().st_size)
          PY

      - name: Commit AI map
        run: |
          if git diff --quiet -- naehen/assets/bocholt-kirmes-2026-plan.webp; then
            echo "Map unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naehen/assets/bocholt-kirmes-2026-plan.webp
          git commit -m "chore(naehen): AI upscale Bocholt 2026 map [skip ci]"
          git push
