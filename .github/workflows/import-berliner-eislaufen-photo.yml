name: Import original Berliner Eislaufen photo

on:
  push:
    paths:
      - .github/workflows/import-berliner-eislaufen-photo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download untouched official Phantasialand ice rink photograph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request
          url = "https://static.phlcdn.de/files/uploads/themenpark/images/winter/berlin/2022/hm-berlin-wintertraum-2022_14.jpg"
          target = Path("naehen/assets/berliner-eislaufen-original.jpg")
          target.parent.mkdir(parents=True, exist_ok=True)
          request = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; NAEHEN winter photo import)",
              "Referer": "https://www.phantasialand.de/de/themenpark/einzigartige-attraktionen/berliner-eislaufen/"
          })
          with urllib.request.urlopen(request, timeout=35) as res:
              data = res.read(15000000)
          if not data.startswith(b"\xff\xd8\xff") or len(data) < 50000:
              raise ValueError("Official source did not return a valid full JPEG")
          target.write_bytes(data)
          print(target, "bytes", len(data), "sha256", hashlib.sha256(data).hexdigest())
          PY
      - name: Commit original unchanged photograph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naehen/assets/berliner-eislaufen-original.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets(naehen): add untouched official Berliner Eislaufen photo"
            git push
          fi
