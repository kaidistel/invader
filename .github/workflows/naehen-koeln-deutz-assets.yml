name: "NÄHEN · Köln-Deutz lizenzierte Bilder lokal"
on:
  push:
    paths:
      - ".github/workflows/naehen-koeln-deutz-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-commons-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: "Lokal speichern, Metadaten aktualisieren, PWA Cache erhöhen"
        run: python naehen/scripts/import_deutz_commons.py
      - name: "Bilder und aktualisierte Dateien ins Repository übernehmen"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naehen/assets/koeln-deutz-herbst-2026-background.webp
          git add naehen/assets/koeln-deutz-herbst-2026-mr-gravity.webp
          git add naehen/assets/KOELN_DEUTZ_LICENSES.md
          git add naehen/koeln-deutz-herbstvolksfest-2026-config.js naehen/index.html naehen/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "NÄHEN: lokale CC-Bilder für Köln-Deutz und Mr. Gravity (v129)"
            git push
          fi
