name: Patch Nightfly GLB logo
on:
  push:
    paths:
      - nightfly/tools/center_logo.py
      - nightfly/assets/nightfly-logo-reference.jpg
      - .github/workflows/nightfly-logo-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Rewrite actual GLB model
        run: python nightfly/tools/center_logo.py
      - name: Validate node placement and GLB structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path('nightfly/public/nightfly.glb')
          b=p.read_bytes()
          assert b[:4] == b'glTF'
          assert struct.unpack_from('<I', b, 8)[0] == len(b)
          size,chunk=struct.unpack_from('<II', b, 12)
          assert chunk == 0x4e4f534a
          g=json.loads(b[20:20+size])
          names={n.get('name'):i for i,n in enumerate(g['nodes'])}
          main=g['nodes'][names['Main swing axis']]
          tower=g['nodes'][names['Tower tilt hinge']]
          logo=names['Nightfly logo | centered swing-arm decal']
          assert logo in main['children']
          assert names['Badge backing'] not in tower['children']
          assert names['Hub logo'] not in tower['children']
          m=g['meshes'][g['nodes'][logo]['mesh']]['primitives'][0]
          assert m['material'] < len(g['materials'])
          assert g['materials'][m['material']]['alphaMode']=='BLEND'
          print('GLB validated. New logo is attached to swinging arm, old badge detached.')
          PY
      - name: Commit corrected 3D model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightfly/public/nightfly.glb
          if git diff --cached --quiet; then
            echo "GLB already up to date."
          else
            git commit -m "fix(nightfly): remove hanging circle, center actual logo on swing arm"
            git push origin HEAD:main
          fi
