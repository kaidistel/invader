name: Verify Winterdom map asset
on:
  push:
    branches:
      - feature/winterdom-2026-clickable-original-plan
    paths:
      - .github/workflows/verify-winterdom-map.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from hashlib import sha256
          f=Path('naehen/assets/hamburg-winterdom-2026-lageplan.png')
          with Image.open(f) as im:
              print('size',im.size,'format',im.format,'mode',im.mode)
              assert im.size==(2048,1448)
          print('sha256',sha256(f.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: winterdom-map-inspection
          path: naehen/assets/hamburg-winterdom-2026-lageplan.png
          retention-days: 1
