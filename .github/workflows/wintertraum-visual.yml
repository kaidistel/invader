name: Wintertraum responsive visual QA
on:
  push:
    paths:
      - 'naehen/wintertraum-atelier.css'
      - 'naehen/wintertraum-details.css'
      - 'naehen/wintertraum-recap.css'
      - 'naehen/test-wintertraum-recap-browser.cjs'
      - 'naehen/hallowinter.css'
      - 'naehen/test-europa-hallowinter-browser.cjs'
      - 'naehen/test-europa-hallowinter.cjs'
      - 'naehen/wintertraum-snow.css'
      - 'naehen/wintertraum-snow.js'
      - 'naehen/test-wintertraum-snow-browser.cjs'
      - 'naehen/test-wintertraum-detail-browser.cjs'
      - 'naehen/test-wintertraum-browser.cjs'
      - 'naehen/index.html'
      - '.github/workflows/wintertraum-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify mobile, tablet and desktop layout with Chromium
        run: node naehen/test-wintertraum-browser.cjs
      - name: Verify Wintertraum attraction detail views in Chromium
        run: node naehen/test-wintertraum-detail-browser.cjs
      - name: Verify interactive Wintertraum snow on mobile and desktop
        run: node naehen/test-wintertraum-snow-browser.cjs
      - name: Verify Wintertraum completed-day recap and archive in Chromium
        run: node naehen/test-wintertraum-recap-browser.cjs
      - name: Verify Europa-Park HALLOWinter and Voltron in Chromium
        run: node naehen/test-europa-hallowinter-browser.cjs
      - name: Publish six viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wintertraum-responsive-and-detail-screenshots
          path: naehen/wintertraum-responsive-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
