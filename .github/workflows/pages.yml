name: Deploy Invader to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Phantasialand live queue data
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 25 \
            "https://queue-times.com/parks/56/queue_times.json" \
            --output "naehen/live.json"
          test -s "naehen/live.json"

      - name: Evaluate NÄHEN push alerts
        env:
          NAEHEN_SUPABASE_URL: ${{ secrets.NAEHEN_SUPABASE_URL }}
          NAEHEN_SUPABASE_SECRET_KEY: ${{ secrets.NAEHEN_SUPABASE_SECRET_KEY }}
          NAEHEN_VAPID_PUBLIC_KEY: ${{ secrets.NAEHEN_VAPID_PUBLIC_KEY }}
          NAEHEN_VAPID_PRIVATE_KEY: ${{ secrets.NAEHEN_VAPID_PRIVATE_KEY }}
          NAEHEN_VAPID_SUBJECT: ${{ secrets.NAEHEN_VAPID_SUBJECT }}
        run: |
          if [ -z "$NAEHEN_SUPABASE_URL" ] || [ -z "$NAEHEN_SUPABASE_SECRET_KEY" ] || [ -z "$NAEHEN_VAPID_PUBLIC_KEY" ] || [ -z "$NAEHEN_VAPID_PRIVATE_KEY" ]; then
            echo "NÄHEN push secrets not configured yet; skipping push evaluation."
            exit 0
          fi
          mkdir -p /tmp/naehen-push
          cd /tmp/naehen-push
          npm init -y >/dev/null 2>&1
          npm install --silent web-push@3.6.7
          NODE_PATH=/tmp/naehen-push/node_modules node "$GITHUB_WORKSPACE/naehen/push-alerts.cjs" "$GITHUB_WORKSPACE/naehen/live.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
