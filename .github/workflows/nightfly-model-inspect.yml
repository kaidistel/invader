name: Inspect Nightfly GLB
on:
  push:
    paths:
      - .github/workflows/nightfly-model-inspect.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe critical meshes and pivots
        run: |
          python3 - <<'PY'
          import json,struct
          b=open('nightfly/public/nightfly.glb','rb').read()
          jlen,jtype=struct.unpack_from('<II',b,12)
          g=json.loads(b[20:20+jlen]);ns=g['nodes'];ms=g['meshes'];ac=g['accessors'];ma=g['materials']
          parents={c:i for i,n in enumerate(ns) for c in n.get('children',[])}
          keys=['Tower tilt hinge','Loading alignment | straight carrier','Main swing axis','Rotor axial rotation','Long silver swing arm','Hub logo','Badge backing']
          focus=set(range(1095,1124))
          focus.update(i for i,n in enumerate(ns) if n.get('name') in keys)
          for i in sorted(focus):
            n=ns[i];mi=n.get('mesh')
            print('NODE',i,'parent',parents.get(i),'name',n.get('name'),'mesh',mi,'t',n.get('translation'),'r',n.get('rotation'),'s',n.get('scale'),'children',n.get('children',[])[:12])
            if mi is not None:
              m=ms[mi]
              for pr in m.get('primitives',[]):
                ai=pr.get('attributes',{}).get('POSITION'); p=ac[ai] if ai is not None else {}
                mid=pr.get('material')
                mat=ma[mid] if mid is not None else {}
                print('  PRIM','material',mid,mat.get('name'),'mode',pr.get('mode'),'count',p.get('count'),'min',p.get('min'),'max',p.get('max'),'attr',list(pr.get('attributes',{})))
                print('  MAT','pbr',mat.get('pbrMetallicRoughness'),'alphaMode',mat.get('alphaMode'),'doubleSided',mat.get('doubleSided'))
          print('TEXTURES',len(g.get('textures',[])),'IMAGES',len(g.get('images',[])))
          PY
