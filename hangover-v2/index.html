<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Hangover — 80m Freefall Simulator</title>
<script type="importmap">{"imports":{"three":"../nightfly/vendor/three.module.js"}}</script>
<style>
:root{--panel:rgba(8,13,21,.93);--line:#2b3950;--text:#eef5ff;--muted:#91a1b7;--yellow:#ffd31a;--red:#ff5463;--green:#63e6a2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:20;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));height:52px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 12px;backdrop-filter:blur(10px)}.brand{font-weight:900;letter-spacing:.07em}.brand small{display:block;color:var(--muted);font-size:10px}.state{border:1px solid #42536f;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800}.panel{position:fixed;z-index:15;top:72px;width:270px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px)}.left{left:10px}.right{right:10px}.section{margin-bottom:12px}.section:last-child{margin-bottom:0}.section h3{margin:0 0 8px;color:#9fb0c8;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{border:1px solid #213046;background:#0b121d;border-radius:10px;padding:9px}.metric span{display:block;color:var(--muted);font-size:9px}.metric b{display:block;font-size:16px}.row{display:flex;justify-content:space-between;gap:8px;color:#afbdd0;font-size:12px;margin:6px 0}.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2d3948}.lamp.on{background:var(--green)}.lamp.warn{background:var(--yellow)}button,select,input{font:inherit}button{border:1px solid #34445e;background:#111a28;color:#eef5ff;border-radius:10px;padding:10px;font-weight:800;min-height:42px;touch-action:manipulation}button.primary{background:#e5b900;color:#111;border-color:#ffe35c}button.danger{background:#42151b;border-color:#7d2832;color:#ffc0c5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.full{grid-column:1/-1}select{width:100%;min-height:42px;background:#0b1420;color:#eef5ff;border:1px solid #34445e;border-radius:9px;padding:8px}input[type=range]{width:100%}.bottom{position:fixed;z-index:18;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.bottom button{white-space:nowrap;min-height:38px;padding:8px 10px;font-size:10px}.mobileDock{display:none}.boot{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:#05070b;text-align:center;padding:24px;font-weight:800;letter-spacing:.05em}.boot.hidden{display:none}.boot small{display:block;margin-top:8px;color:#ff9da5;font-weight:600;letter-spacing:0}
@media(max-width:700px){.brand{font-size:11px}.brand small{display:none}.panel{left:8px;right:8px;top:auto;bottom:68px;width:auto;max-height:60vh;overflow:auto;transform:translateY(calc(100% + 100px));transition:.2s}.panel.open{transform:translateY(0)}.bottom{left:8px;right:8px;transform:none;overflow-x:auto}.mobileDock{display:flex;position:fixed;z-index:22;right:10px;top:64px;gap:6px}.mobileDock button{min-height:36px;padding:7px 9px;font-size:10px;background:var(--panel)}.metric b{font-size:14px}}
</style>
</head>
<body>
<div id="boot" class="boot"><div id="bootText">3D-ENGINE WIRD GELADEN …</div></div>
<div id="view"></div>
<div class="top"><div class="brand">HANGOVER // THE TOWER<small>Funtime 80 m · Web3D Operator Simulator</small></div><div id="state" class="state">START</div></div>
<div class="mobileDock"><button id="showData">DATEN</button><button id="showControl">STEUERUNG</button></div>
<div id="dataPanel" class="panel left"><div class="section"><h3>Live telemetry</h3><div class="grid"><div class="metric"><span>Höhe</span><b id="height">3.2 m</b></div><div class="metric"><span>Speed</span><b id="speed">0.0 m/s</b></div><div class="metric"><span>G-Force</span><b id="gforce">1.00 g</b></div><div class="metric"><span>Rotation</span><b id="rpm">1.2 rpm</b></div></div></div><div class="section"><h3>Systems</h3><div class="row"><span><i class="lamp on"></i> PLC</span><b>READY</b></div><div class="row"><span><i id="restLamp" class="lamp"></i> Bügelkreis</span><b id="restTxt">OPEN</b></div><div class="row"><span><i id="brakeLamp" class="lamp on"></i> Magnetbremse</span><b id="brakeTxt">READY</b></div></div><div class="section"><h3>Kamera</h3><select id="cameraSel"><option value="orbit">Freie Kamera</option><option value="ground">Bodenansicht</option><option value="onride">Onride</option><option value="tower">Turmkamera</option></select></div></div>
<div id="controlPanel" class="panel right"><div class="section"><h3>Operator panel</h3><div class="controls"><button id="lock">Bügel schließen</button><button id="unlock">Bügel öffnen</button><button id="cycle" class="primary full">Automatikzyklus starten</button><button id="lift">Lift manuell</button><button id="drop">Drop freigeben</button><button id="return">Return</button><button id="rotate">Rotation</button><button id="estop" class="danger full">NOT-AUS</button></div></div><div class="section"><h3>Parameter</h3><div class="row"><span>Top Hold</span><b id="holdVal">2.5 s</b></div><input id="hold" type="range" min="0.5" max="8" step="0.5" value="2.5"><div class="row"><span>Lift Speed</span><b id="liftVal">1.9 m/s</b></div><input id="liftSpeed" type="range" min="0.7" max="3.2" step="0.1" value="1.9"><div class="row"><span>Rotation</span><b id="rotVal">1.2 rpm</b></div><input id="rotSpeed" type="range" min="0" max="2.5" step="0.1" value="1.2"></div></div>
<div class="bottom"><button data-cam="orbit">ORBIT</button><button data-cam="ground">GROUND</button><button data-cam="onride">ONRIDE</button><button data-cam="tower">TOWER</button><button id="resetView">RESET</button></div>
<script type="module" src="./app.js"></script>
</body>
</html>
