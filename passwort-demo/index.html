<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwortangriffe – Unterrichtsdemo</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f9; color: #182436; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); }
    .label { color: #526278; font-size: .875rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    h1 { margin: 6px 0 8px; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.16; }
    .intro { margin: 0 0 20px; color: #526278; }
    .card { padding: 28px; background: white; border: 1px solid #d9e0e9; border-radius: 16px; box-shadow: 0 14px 38px #24344c12; }
    label { display: block; margin: 14px 0 6px; font-weight: 650; }
    input { display: block; width: 100%; min-height: 46px; padding: 10px 12px; font: inherit; color: inherit; border: 1px solid #aab6c6; border-radius: 8px; background: #fff; }
    input:focus { outline: 3px solid #95beff; outline-offset: 1px; }
    button { width: 100%; min-height: 47px; margin-top: 21px; border: 0; border-radius: 8px; background: #184f9c; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #103c79; }
    button:disabled { opacity: .55; cursor: wait; }
    .message { min-height: 26px; margin: 15px 0 0; font-weight: 650; }
    .message.success { color: #126739; }
    .message.error { color: #a4292d; }
    .note { margin: 18px 0 0; padding: 14px 16px; border-left: 3px solid #8eaccd; background: #eaf0f7; border-radius: 4px; color: #36485e; font-size: .92rem; }
    code { font: .94em ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="label">IT-Sicherheit · Unterrichtsdemo</div>
    <h1>Test-Anmeldung</h1>
    <p class="intro">Eine fiktive Anwendung zum Erklären von Passwortangriffen.</p>
    <section class="card" aria-label="Anmeldeformular">
      <form id="login-form" autocomplete="off">
        <label for="username">Benutzername</label>
        <input id="username" name="username" value="demo" required spellcheck="false">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" required>
        <button id="submit" type="submit">Anmelden</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
    <p class="note" id="mode"></p>
  </main>
  <script>
    const local = ['127.0.0.1', 'localhost'].includes(location.hostname);
    const form = document.querySelector('#login-form');
    const button = document.querySelector('#submit');
    const message = document.querySelector('#message');
    document.querySelector('#mode').textContent = local
      ? 'Lokaler Modus: Der Testserver prüft die Anmeldung. Hier kann Hydra gegen 127.0.0.1 testen.'
      : 'GitHub Pages: Browser-Simulation. Eine echte Passwortprüfung läuft nur mit dem lokalen Testserver.';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.className = 'message';
      message.textContent = 'Prüfe Anmeldung …';
      const data = new FormData(form);
      try {
        let ok;
        if (local) {
          const response = await fetch('./api/login', { method: 'POST', body: new URLSearchParams(data) });
          ok = response.ok && (await response.text()) === 'LOGIN_OK';
        } else {
          // Nur eine Darstellung im Browser: kein geschützter oder echter Login.
          ok = data.get('username') === 'demo' && data.get('password') === 'Kirmes2026!';
        }
        message.className = `message ${ok ? 'success' : 'error'}`;
        message.textContent = ok ? 'Anmeldung erfolgreich (Demo).' : 'Benutzername oder Passwort falsch.';
      } catch {
        message.className = 'message error';
        message.textContent = 'Testserver nicht erreichbar. Starte server.py im selben Ordner.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
